<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<link rel="icon" type="image/jpeg" href="icon.JPG">
<link rel="apple-touch-icon" href="icon.JPG">
<meta name="theme-color" content="#24100a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>دقيقة واحدة</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--bg:#100a08;
--bg2:#24100a;
--panel:rgba(255,255,255,.055);
--panel2:rgba(255,255,255,.09);
--border:rgba(255,255,255,.1);
--text:#fffaf7;
--muted:#b6a39a;
--orange:#f97316;
--amber:#f59e0b;
--coral:#fb7185;
--gold:#fbbf24;
}

body{
min-height:100vh;
font-family:Arial,"Tahoma",sans-serif;
color:var(--text);
background:
radial-gradient(circle at 18% 12%,rgba(249,115,22,.16),transparent 28%),
radial-gradient(circle at 82% 85%,rgba(251,113,133,.11),transparent 30%),
linear-gradient(145deg,var(--bg),var(--bg2));
overflow-x:hidden
}

button,input{font:inherit}
button{cursor:pointer}

.app{min-height:100vh;display:flex}

.sidebar{
position:fixed;
right:0;
top:0;
width:260px;
height:100vh;
padding:25px 18px;
background:rgba(17,9,7,.91);
backdrop-filter:blur(24px);
border-left:1px solid var(--border);
z-index:50
}

.logo{
display:flex;
align-items:center;
gap:12px;
padding:4px 7px 30px
}

.logo-img{
width:46px;
height:46px;
border-radius:14px;
overflow:hidden;
box-shadow:0 10px 30px rgba(249,115,22,.16)
}

.logo-img img{
width:100%;
height:100%;
object-fit:cover
}

.logo h2{font-size:18px}
.logo p{
font-size:11px;
color:var(--muted);
margin-top:4px
}

.nav{display:grid;gap:7px}

.nav button{
border:0;
background:transparent;
color:var(--muted);
padding:14px;
border-radius:14px;
text-align:right;
transition:.2s
}

.nav button:hover,
.nav button.active{
background:var(--panel2);
color:var(--text)
}

.nav button.active{
box-shadow:inset -3px 0 var(--orange)
}

.main{
width:calc(100% - 260px);
margin-right:260px;
min-height:100vh;
padding:35px
}

.top{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:30px
}

.menu{
display:none;
width:45px;
height:45px;
border-radius:13px;
border:1px solid var(--border);
background:var(--panel);
color:var(--text)
}

.hero{
max-width:1100px;
margin:auto;
padding:42px;
border:1px solid var(--border);
border-radius:30px;
background:
linear-gradient(135deg,rgba(249,115,22,.15),rgba(251,191,36,.035)),
var(--panel);
box-shadow:0 25px 70px rgba(0,0,0,.32)
}

.hero h1{
font-size:clamp(31px,5vw,54px);
margin-bottom:12px
}

.hero p{
color:var(--muted);
line-height:1.9;
max-width:650px
}

.workspace{
max-width:1100px;
margin:25px auto 0;
display:grid;
grid-template-columns:1.35fr .65fr;
gap:20px
}

.timer-card,
.side-card{
border:1px solid var(--border);
background:var(--panel);
border-radius:26px;
padding:28px
}

.timer-card{text-align:center}

.label{
color:var(--muted);
font-size:14px;
margin-bottom:10px
}

.timer{
font-size:clamp(75px,13vw,135px);
font-weight:900;
letter-spacing:4px;
direction:ltr;
font-variant-numeric:tabular-nums;
text-shadow:0 0 45px rgba(249,115,22,.18)
}

.progress{
height:8px;
background:rgba(255,255,255,.07);
border-radius:20px;
overflow:hidden;
margin:20px 0 24px
}

.progress span{
display:block;
height:100%;
width:100%;
border-radius:20px;
background:linear-gradient(90deg,var(--orange),var(--amber),var(--coral));
transition:width .2s linear
}

.controls{
display:flex;
justify-content:center;
gap:9px;
flex-wrap:wrap
}

.btn{
border:1px solid var(--border);
background:var(--panel2);
color:var(--text);
padding:12px 19px;
border-radius:13px;
transition:.2s
}

.btn:hover{transform:translateY(-1px)}

.btn.primary{
border:0;
background:linear-gradient(135deg,var(--orange),var(--amber));
color:#271006;
font-weight:800;
box-shadow:0 10px 25px rgba(249,115,22,.18)
}

.side-card h3{margin-bottom:20px}

.stat{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 0;
border-bottom:1px solid var(--border)
}

.stat:last-child{border-bottom:0}

.stat span{color:var(--muted)}

.stat strong{
font-size:22px
}

.challenge{
max-width:1100px;
margin:20px auto 0;
padding:25px;
border:1px solid var(--border);
background:var(--panel);
border-radius:24px
}

.challenge h3{margin-bottom:8px}

.challenge p{
color:var(--muted);
line-height:1.8
}

.task-area{
max-width:1100px;
margin:18px auto 0;
display:flex;
gap:10px
}

.task-input{
flex:1;
height:53px;
border:1px solid var(--border);
border-radius:14px;
background:var(--panel);
color:var(--text);
outline:none;
padding:0 16px
}

.task-input:focus{
border-color:rgba(249,115,22,.6);
box-shadow:0 0 0 4px rgba(249,115,22,.07)
}

.history{
max-width:1100px;
margin:18px auto;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px
}

.history-card{
border:1px solid var(--border);
background:var(--panel);
border-radius:19px;
padding:19px
}

.history-card .number{
font-size:30px;
font-weight:900;
margin-bottom:5px
}

.history-card p{
color:var(--muted);
font-size:13px
}

.toast{
position:fixed;
left:20px;
bottom:20px;
padding:13px 18px;
background:#26130d;
border:1px solid var(--border);
border-radius:13px;
transform:translateY(100px);
opacity:0;
transition:.3s;
z-index:100
}

.toast.show{
transform:translateY(0);
opacity:1
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
display:none;
z-index:40
}

.overlay.show{display:block}

@media(max-width:850px){
.sidebar{
transform:translateX(100%);
transition:.3s
}

.sidebar.open{transform:translateX(0)}

.overlay.show{display:block}

.main{
width:100%;
margin-right:0;
padding:20px
}

.menu{display:block}

.workspace{grid-template-columns:1fr}

.hero{padding:28px}
}

@media(max-width:600px){
.task-area{flex-direction:column}

.task-area .btn{width:100%}

.history{grid-template-columns:1fr}

.timer-card,
.side-card{padding:22px}
}
</style>
</head>

<body>

<div class="overlay" id="overlay"></div>

<div class="app">

<aside class="sidebar" id="sidebar">

<div class="logo">
<div class="logo-img">
<img src="icon.JPG" alt="دقيقة واحدة">
</div>

<div>
<h2>دقيقة واحدة</h2>
<p>أنجز الآن</p>
</div>
</div>

<nav class="nav">

<button class="active" data-section="home">
◉ المهمة الحالية
</button>

<button data-section="history">
▣ السجل
</button>

<button data-section="stats">
★ إنجازاتي
</button>

</nav>

</aside>

<main class="main">

<div class="top">
<button class="menu" id="menu">☰</button>
<div></div>
</div>

<section class="hero">
<h1>دقيقة واحدة تكفي للبداية.</h1>

<p>
اختر مهمة صغيرة، اضبط الدقيقة، وابدأ فورًا.
الفكرة ليست أن تنجز كل شيء، بل أن تكسر حاجز البداية.
</p>
</section>

<section class="workspace">

<div class="timer-card">

<div class="label" id="timerLabel">دقيقة العمل</div>

<div class="timer" id="timer">01:00</div>

<div class="progress">
<span id="progress"></span>
</div>

<div class="controls">

<button class="btn primary" id="start">
ابدأ الآن
</button>

<button class="btn" id="pause">
إيقاف
</button>

<button class="btn" id="reset">
إعادة
</button>

</div>

</div>

<div class="side-card">

<h3>ملخصك</h3>

<div class="stat">
<span>محاولات اليوم</span>
<strong id="attempts">0</strong>
</div>

<div class="stat">
<span>الدقائق المنجزة</span>
<strong id="minutes">0</strong>
</div>

<div class="stat">
<span>أعلى سلسلة</span>
<strong id="streak">0</strong>
</div>

</div>

</section>

<section class="challenge">

<h3>مهمتك الآن</h3>

<p id="currentTask">
لا توجد مهمة محددة. اكتب شيئًا صغيرًا تريد إنجازه.
</p>

</section>

<section class="task-area">

<input
class="task-input"
id="taskInput"
placeholder="مثال: اقرأ صفحة واحدة..."
maxlength="120"
>

<button class="btn primary" id="setTask">
تحديد المهمة
</button>

</section>

<section class="history" id="history"></section>

</main>

</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

const STORAGE_KEY="one_minute_app_v1";

const defaultState={
attempts:0,
minutes:0,
streak:0,
bestStreak:0,
currentTask:"",
history:[]
};

let state=JSON.parse(localStorage.getItem(STORAGE_KEY))||defaultState;

let remaining=60;
let total=60;
let running=false;
let interval=null;

const timer=document.getElementById("timer");
const progress=document.getElementById("progress");
const attempts=document.getElementById("attempts");
const minutes=document.getElementById("minutes");
const streak=document.getElementById("streak");
const history=document.getElementById("history");
const currentTask=document.getElementById("currentTask");
const taskInput=document.getElementById("taskInput");
const toast=document.getElementById("toast");
const sidebar=document.getElementById("sidebar");
const overlay=document.getElementById("overlay");

function save(){
localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
}

function escapeHTML(value){
return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

function showToast(message){
toast.textContent=message;
toast.classList.add("show");

clearTimeout(showToast.timer);

showToast.timer=setTimeout(()=>{
toast.classList.remove("show");
},2200);
}

function formatTime(seconds){
const minutesPart=Math.floor(seconds/60)
.toString()
.padStart(2,"0");

const secondsPart=(seconds%60)
.toString()
.padStart(2,"0");

return `${minutesPart}:${secondsPart}`;
}

function updateTimer(){

timer.textContent=formatTime(remaining);

progress.style.width=
Math.max(0,(remaining/total)*100)+"%";
}

function renderStats(){

attempts.textContent=state.attempts;
minutes.textContent=state.minutes;
streak.textContent=state.streak;

currentTask.textContent=
state.currentTask||
"لا توجد مهمة محددة. اكتب شيئًا صغيرًا تريد إنجازه.";

history.innerHTML="";

if(!state.history.length){
history.innerHTML=`
<div class="history-card">
<div class="number">—</div>
<p>لم تبدأ أي دقيقة بعد.</p>
</div>`;
return;
}

state.history.slice(0,6).forEach((item,index)=>{

const card=document.createElement("div");
card.className="history-card";

card.innerHTML=`
<div class="number">#${state.history.length-index}</div>
<p>${escapeHTML(item.task||"جلسة بدون مهمة")}</p>
`;

history.appendChild(card);

});
}

function startTimer(){

if(running)return;

running=true;

interval=setInterval(()=>{

remaining--;
updateTimer();

if(remaining<=0){
finishMinute();
}

},1000);

showToast("بدأت الدقيقة");
}

function pauseTimer(){

if(!running)return;

clearInterval(interval);
interval=null;
running=false;

showToast("تم إيقاف الدقيقة");
}

function resetTimer(){

clearInterval(interval);
interval=null;
running=false;

remaining=60;
total=60;

updateTimer();
}

function finishMinute(){

clearInterval(interval);
interval=null;
running=false;

state.attempts++;
state.minutes++;
state.streak++;
state.bestStreak=Math.max(
state.bestStreak,
state.streak
);

state.history.unshift({
task:state.currentTask,
date:new Date().toISOString()
});

state.history=state.history.slice(0,20);

save();
renderStats();

showToast("أحسنت، أنهيت دقيقة كاملة");

remaining=60;
total=60;

updateTimer();
}

document.getElementById("start")
.addEventListener("click",startTimer);

document.getElementById("pause")
.addEventListener("click",pauseTimer);

document.getElementById("reset")
.addEventListener("click",()=>{
resetTimer();
showToast("تمت إعادة الدقيقة");
});

document.getElementById("setTask")
.addEventListener("click",setTask);

taskInput.addEventListener("keydown",e=>{
if(e.key==="Enter")setTask();
});

function setTask(){

const value=taskInput.value.trim();

if(!value){
showToast("اكتب المهمة أولًا");
taskInput.focus();
return;
}

state.currentTask=value;
save();
renderStats();

taskInput.value="";

showToast("تم تحديد المهمة");
}

document.getElementById("menu")
.addEventListener("click",()=>{
sidebar.classList.toggle("open");
overlay.classList.toggle("show");
});

overlay.addEventListener("click",closeMenu);

function closeMenu(){
sidebar.classList.remove("open");
overlay.classList.remove("show");
}

document.querySelectorAll(".nav button")
.forEach(button=>{

button.addEventListener("click",()=>{

document.querySelectorAll(".nav button")
.forEach(item=>item.classList.remove("active"));

button.classList.add("active");

const section=button.dataset.section;

closeMenu();

if(section==="home"){
window.scrollTo({top:0,behavior:"smooth"});
}

if(section==="history"){
history.scrollIntoView({behavior:"smooth"});
}

if(section==="stats"){
document.querySelector(".side-card")
.scrollIntoView({behavior:"smooth"});
}

});
});

document.addEventListener("keydown",e=>{

if(
(e.ctrlKey||e.metaKey)&&
e.key.toLowerCase()==="enter"
){
e.preventDefault();

if(running){
pauseTimer();
}else{
startTimer();
}
}

if(
e.code==="Space"&&
document.activeElement.tagName!=="INPUT"
){
e.preventDefault();

if(running){
pauseTimer();
}else{
startTimer();
}
}

if(e.key==="Escape"){
pauseTimer();
closeMenu();
}

});

renderStats();
updateTimer();
</script>

</body>
</html>
